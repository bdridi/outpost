name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # Git Bash on windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the test scripts
        run: |
          fail=0
          for t in tests/*.sh; do
            echo "::group::$t"
            bash "$t" || fail=1
            echo "::endgroup::"
          done
          exit "$fail"
